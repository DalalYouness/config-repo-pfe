server.port=8084
#config for spring data jpa
spring.datasource.url=jdbc:mysql://localhost:3306/notification-db

# kafka consumer config
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Set Delegate Deserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.type.mapping=com.dalal.boukingandreviewservicepfe.dtos.event.ReservationCreatedEvent:com.dalal.notificationsservicepfe.dtos.event.ReservationCreatedEvent,com.dalal.boukingandreviewservicepfe.dtos.event.ReservationStatusUpdatedEvent:com.dalal.notificationsservicepfe.dtos.event.ReservationStatusUpdatedEvent,com.dalal.boukingandreviewservicepfe.dtos.event.ReviewCreatedEvent:com.dalal.notificationsservicepfe.dtos.event.ReviewCreatedEvent